name: Pull request

on: pull_request

jobs:
  checks:
    name: Clippy and formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@083fe80ad9eef062785971a2d47135b1f499d5e1 # Rust 1.96.1
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
      - run: cargo clippy
      - run: cargo fmt --check --all
      - run: git diff --exit-code

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@083fe80ad9eef062785971a2d47135b1f499d5e1 # Rust 1.96.1
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
      - run: cargo test --no-run
      - run: cargo test --no-fail-fast

  licenses:
    name: Check licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@083fe80ad9eef062785971a2d47135b1f499d5e1 # Rust 1.96.1
      - uses: typst/notices@0e44c240da489017e8766ed80eab2d03b2833a0c # v0.1.2
        with:
          args: check --deps --allow-missing
